server {
    listen 8080;
    server_name localhost;
    client_max_body_size 1000000;
    root www/html;
    index index.html;

    # location / {
    #     root www/html;
    #     index index.html;
    #     autoindex on;
    #     allow_methods GET;
    # }

    location /upload {
        client_max_body_size 209715200;
        root www/html;
        upload_dir www/html/uploads;
        allow_methods GET POST DELETE;
    }

    location /cgi-bin {
        root www/cgi-bin;
        cgi_pass .php /usr/bin/php-cgi;
        allow_methods GET POST;
    }

    location /cgi-bin {
    root www/cgi-bin;
    cgi_pass .php /usr/bin/php-cgi;
    allow_methods GET POST;
    }

    location /cgi-bin {
        root www/cgi-bin;
        cgi_pass .php /usr/bin/php-cgi;
        cgi_pass .py /usr/bin/python3;  # Add this line!
        allow_methods GET POST;
    }
    
    location /old-page {
        return 301 /new-page;
    }
}