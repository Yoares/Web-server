server {
    listen 8080;
    server_name localhost;
    
    # Global default: 1MB max body size
    client_max_body_size 1000000; 
    root www/html/;
    index index.html;

    # 1. The Default Fallback
    location / {
        root www/html;
        index index.html;
        autoindex on;
        allow_methods GET POST;
    }

    # 2. The 301 Redirect
    location /old-page {
        allow_methods GET POST;
        return 301 /new-page.html;  
    }

    # 3. The File Upload Endpoint
    location /upload {
        # Overrides global max_body_size for this specific route (~200MB)
        client_max_body_size 209715200; 
        root www/html;
        upload_dir www/html/upload;
        allow_methods GET POST DELETE;
    }

    # 4. The FastCGI Endpoint
    location /cgi-bin {
        root www/cgi-bin;
        cgi_pass .php /usr/bin/php-cgi;
        cgi_pass .py /usr/bin/python3;
        allow_methods GET POST;
    }
}